<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Push & Crush｜玩法原型 v0.2</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#29304a;background:#f2f5fc}*{box-sizing:border-box}body{margin:0;padding:18px;display:flex;justify-content:center}.app{width:min(100%,510px)}h1{margin:0 0 5px;font-size:28px}.sub{color:#67708b;margin:0 0 14px}.stats{display:flex;gap:8px;margin-bottom:12px}.stat{background:white;border-radius:13px;padding:11px;flex:1;text-align:center;box-shadow:0 3px 12px #2221}.stat strong{display:block;font-size:21px}.stat small{color:#68718b}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#c9d3e7;border:7px solid #c9d3e7;border-radius:17px;touch-action:none;user-select:none}.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:7px;background:#e9eef7;position:relative}.wall{background:#6b7894;box-shadow:inset 0 -3px #4e5971}.crate{width:85%;height:85%;border-radius:11px;box-shadow:inset 0 -5px #0002,0 3px 4px #0002;display:grid;place-items:center;font-size:clamp(14px,4vw,26px);font-weight:900;color:#fff}.r{background:#f06a75}.b{background:#5e9def}.y{background:#efb94f}.player{width:80%;height:80%;border-radius:50%;background:#393e65;border:4px solid white;box-shadow:0 2px 7px #0003;display:grid;place-items:center;font-size:clamp(16px,4.5vw,25px)}.target{position:absolute;inset:5px;border:2px dashed #98a5b8;border-radius:8px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}.buttons button,.dpad button{border:0;background:white;border-radius:12px;padding:11px 15px;font-size:15px;font-weight:700;color:#34405c;box-shadow:0 3px 10px #2221;cursor:pointer}.buttons button:active,.dpad button:active{transform:scale(.95)}.dpad{display:grid;grid-template-columns:repeat(3,60px);gap:6px;justify-content:center;margin:14px}.dpad button{height:53px;font-size:22px}.dpad .blank{visibility:hidden}.message{background:#fff;border-radius:13px;padding:12px;min-height:48px;line-height:1.55}.help{color:#66708a;font-size:13px;line-height:1.7;margin-top:12px}.win{color:#128363;font-weight:800}.highlight{outline:3px solid #ffe281;outline-offset:-2px}@media(max-width:400px){body{padding:10px}.board{gap:3px;border-width:5px}}</style></head><body><main class="app"><h1>📦 Push & Crush</h1><p class="sub">倉庫番 × 三消｜互動玩法原型 v0.2</p><div class="stats"><div class="stat"><strong id="moves">0</strong><small>已推步數</small></div><div class="stat"><strong id="remain">0</strong><small>剩餘箱子</small></div><div class="stat"><strong id="combo">0</strong><small>最高連鎖</small></div></div><div class="board" id="board" aria-label="遊戲棋盤"></div><div class="buttons"><button id="undo">↶ 撤銷</button><button id="reset">⟳ 重玩</button><button id="shuffle">⤨ 重整</button><button id="hint">💡 提示</button></div><div class="dpad"><span class="blank"></span><button data-dir="up">↑</button><span class="blank"></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><div class="message" id="msg" aria-live="polite"></div><div class="help">玩法：方向鍵、WASD、畫面滑動或下方按鈕移動角色。走路免費；每次推箱一格扣 1 步。只能推不能拉；同色連續箱子可整排推動。三個同色連成直線會消除，隨後箱子向下掉落，角色可擋住掉落。<br>🎯 本測試關卡目標：清空全部箱子。重整不耗步數，並保留角色位置與箱子顏色數量。</div></main><script>
const N=7,EMPTY='.',WALL='#',P='@';
// Handcrafted first level: two immediate planned matches, then gravity possibilities.
const LEVEL=["#######","#.....#","#.r.b.#","#.r.b.#","#..r.b#","#..@..#","#######"];
let board,player,moves,peak,history=[],busy=false,won=false,selected=null;
const $=id=>document.getElementById(id);
const clone=()=>({board:board.map(row=>row.slice()),player:{...player},moves,peak,won});
function restore(s){board=s.board.map(row=>row.slice());player={...s.player};moves=s.moves;peak=s.peak;won=s.won;busy=false;selected=null;render()}
function init(){board=LEVEL.map(row=>row.split(''));player={x:3,y:5};board[player.y][player.x]=EMPTY;moves=0;peak=0;history=[];busy=false;won=false;selected=null;render();message('把紅箱往左推成直線，或先想想藍箱怎麼消除！')}
const inside=(x,y)=>x>=0&&x<N&&y>=0&&y<N;
const cell=(x,y)=>inside(x,y)?board[y][x]:WALL;
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function render(){const root=$('board');root.innerHTML='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=document.createElement('div');c.className='cell'+(cell(x,y)===WALL?' wall':'')+(selected?.x===x&&selected?.y===y?' highlight':'');c.dataset.x=x;c.dataset.y=y;if(x===player.x&&y===player.y){const p=document.createElement('div');p.className='player';p.textContent='🙂';c.appendChild(p)}else if('rby'.includes(cell(x,y))&&cell(x,y)!==EMPTY){const v=document.createElement('div');v.className='crate '+cell(x,y);v.textContent={r:'◆',b:'●',y:'★'}[cell(x,y)];c.appendChild(v)}root.appendChild(c)}$('moves').textContent=moves;$('remain').textContent=board.flat().filter(v=>'rby'.includes(v)&&v!==EMPTY).length;$('combo').textContent=peak}
function message(t){$('msg').innerHTML=t}
function matches(){let found=new Set();for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const v=cell(x,y);if(!'rby'.includes(v)||v===EMPTY)continue;for(const [dx,dy] of [[1,0],[0,1]]){if(cell(x-dx,y-dy)===v)continue;let coords=[],xx=x,yy=y;while(cell(xx,yy)===v){coords.push([xx,yy]);xx+=dx;yy+=dy}if(coords.length>=3)coords.forEach(([a,b])=>found.add(`${a},${b}`))}}return found}
function gravity(){let changed=false;for(let x=1;x<N-1;x++){let bottom=N-2;for(let y=N-2;y>=1;y--){if(cell(x,y)===WALL||(player.x===x&&player.y===y)){bottom=y-1;continue}const v=cell(x,y);if(!'rby'.includes(v)||v===EMPTY)continue;if(y!==bottom){board[bottom][x]=v;board[y][x]=EMPTY;changed=true}bottom--}}return changed}
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function vibrate(pattern){if(navigator.vibrate)navigator.vibrate(pattern)}
async function settle(){let combo=0;while(true){const m=matches();if(!m.size)break;combo++;peak=Math.max(peak,combo);message(`✨ ${combo===1?'MATCH!':`COMBO ×${combo}!`} 消除 ${m.size} 個箱子`);vibrate(combo===1?35:[35,55,Math.min(100,35+combo*15)]);for(const key of m){const [x,y]=key.split(',').map(Number);board[y][x]=EMPTY}render();await delay(220);gravity();render();await delay(230)}busy=false;render();if(!board.flat().some(v=>'rby'.includes(v)&&v!==EMPTY)){won=true;message(`<span class="win">🎉 過關！最後一推完成消除，共 ${moves} 步，最高 Combo ×${Math.max(1,peak)}。</span>`);vibrate([80,60,110]);return}if(!hasPush()){message('🔄 無法再推動箱子，自動重整！');await delay(400);shuffle(true)}else if(combo)message(`成功觸發 ${combo} 段消除！繼續規劃下一推。`)}
function tryMove(dir){if(busy||won)return;const [dx,dy]=dirs[dir];let x=player.x+dx,y=player.y+dy;const v=cell(x,y);if(v===WALL)return;if(v===EMPTY){player={x,y};render();return}if(!'rby'.includes(v))return;let line=[];while(cell(x,y)===v){line.push([x,y]);x+=dx;y+=dy}if(cell(x,y)!==EMPTY){message('⛔ 只能推動連續同色箱子，而且末端必須有空位。');return}history.push(clone());for(let i=line.length-1;i>=0;i--){const [cx,cy]=line[i];board[cy+dy][cx+dx]=v;board[cy][cx]=EMPTY}player={x:line[0][0],y:line[0][1]};moves++;busy=true;render();if(matches().size){settle()}else{busy=false;message(`推動 ${line.length} 個同色箱子，消耗 1 步。`);if(!hasPush())setTimeout(()=>{if(!busy&&!won&&!hasPush())shuffle(true)},280)}}
function hasPush(){for(const [dx,dy] of Object.values(dirs)){let stack=[[player.x,player.y]],seen=new Set([`${player.x},${player.y}`]);while(stack.length){let [x,y]=stack.pop();for(const [ax,ay] of Object.values(dirs)){let nx=x+ax,ny=y+ay;if(cell(nx,ny)!==EMPTY||seen.has(`${nx},${ny}`))continue;seen.add(`${nx},${ny}`);stack.push([nx,ny])}const v=cell(x+dx,y+dy);if(!'rby'.includes(v)||v===EMPTY)continue;let nx=x+dx,ny=y+dy;while(cell(nx,ny)===v){nx+=dx;ny+=dy}if(cell(nx,ny)===EMPTY)return true}}return false}
function shuffle(auto=false){if(busy||won)return;if(!auto)history.push(clone());const spots=[],colors=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){if(cell(x,y)===WALL||(x===player.x&&y===player.y))continue;spots.push([x,y]);if('rby'.includes(cell(x,y))&&cell(x,y)!==EMPTY)colors.push(cell(x,y));board[y][x]=EMPTY}let good=false;for(let attempt=0;attempt<300;attempt++){for(const [x,y] of spots)board[y][x]=EMPTY;const shuffled=spots.slice().sort(()=>Math.random()-.5);colors.forEach((c,i)=>{const [x,y]=shuffled[i];board[y][x]=c});if(hasPush()&&matches().size===0){good=true;break}}render();message(good?'🔀 箱子已重整，角色位置不變。':'🔀 已重整箱子；目前盤面可能仍需要再重整。')}
$('undo').onclick=()=>{if(busy)return;if(history.length)restore(history.pop());else message('沒有可以撤銷的推動。')};$('reset').onclick=init;$('shuffle').onclick=()=>shuffle(false);$('hint').onclick=()=>message('💡 提示：先把角色走到紅箱右側，再往左推中間偏下的紅箱，試著湊成直向三連。');document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>tryMove(b.dataset.dir));window.addEventListener('keydown',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(k){e.preventDefault();tryMove(k)}});let touch=null;const root=$('board');root.addEventListener('touchstart',e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});root.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.hypot(dx,dy)>22)tryMove(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));touch=null},{passive:true});init();
</script><noscript><p style='padding:15px;background:#fee'>請啟用 JavaScript，並使用 Safari 或 Chrome 開啟本網頁。</p></noscript></body></html>
