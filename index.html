<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Push & Crush｜玩法原型 v0.4</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#29304a;background:#f2f5fc}*{box-sizing:border-box}body{margin:0;padding:18px;display:flex;justify-content:center}.app{width:min(100%,510px)}h1{margin:0 0 5px;font-size:28px}.sub{color:#67708b;margin:0 0 14px}.stats{display:flex;gap:8px;margin-bottom:12px}.stat{background:white;border-radius:13px;padding:11px;flex:1;text-align:center;box-shadow:0 3px 12px #2221}.stat strong{display:block;font-size:21px}.stat small{color:#68718b}.board-wrap{position:relative}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#c9d3e7;border:7px solid #c9d3e7;border-radius:17px;touch-action:none;user-select:none}.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:7px;background:#e9eef7;position:relative;min-width:0}.wall{background:#6b7894;box-shadow:inset 0 -3px #4e5971}.crate{width:85%;height:85%;border-radius:11px;box-shadow:inset 0 -5px #0002,0 3px 4px #0002;display:grid;place-items:center;font-size:clamp(14px,4vw,26px);font-weight:900;color:#fff;transform-origin:center;will-change:transform,opacity,filter}.r{background:#f06a75}.b{background:#5e9def}.y{background:#efb94f}.player{width:80%;height:80%;border-radius:50%;background:#393e65;border:4px solid white;box-shadow:0 2px 7px #0003;display:grid;place-items:center;font-size:clamp(16px,4.5vw,25px)}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}.buttons button,.dpad button{border:0;background:white;border-radius:12px;padding:11px 15px;font-size:15px;font-weight:700;color:#34405c;box-shadow:0 3px 10px #2221;cursor:pointer}.buttons button:active,.dpad button:active{transform:scale(.95)}button:disabled{opacity:.55;cursor:default}.dpad{display:grid;grid-template-columns:repeat(3,60px);gap:6px;justify-content:center;margin:14px}.dpad button{height:53px;font-size:22px}.dpad .blank{visibility:hidden}.message{background:#fff;border-radius:13px;padding:12px;min-height:48px;line-height:1.55}.help{color:#66708a;font-size:13px;line-height:1.7;margin-top:12px}.win{color:#128363;font-weight:800}.highlight{outline:3px solid #ffe281;outline-offset:-2px}
/* Three-stage feedback: recognize the match, pop it, then drop only affected columns. */
.cell.match-mark{background:#fff4c4;box-shadow:inset 0 0 0 3px #ffd44f;z-index:1}.cell.match-mark .crate{animation:matchedPulse .42s ease-in-out both;box-shadow:0 0 0 3px #fff,0 0 18px 5px #ffe06d,inset 0 -4px #0002}.cell.match-pop .crate{animation:matchedPop .29s ease-in forwards}.cell.match-pop::after{content:'✦';position:absolute;color:#fff;z-index:2;font-size:27px;animation:spark .33s ease-out both;pointer-events:none}.crate.falling{animation:fallIn var(--fall-duration,.34s) cubic-bezier(.16,.75,.25,1.2) both;--fall-pixels:0px}.combo-banner{position:absolute;z-index:5;left:50%;top:39%;transform:translate(-50%,-50%);font-size:clamp(22px,6vw,36px);font-weight:1000;color:#fff;text-align:center;white-space:nowrap;text-shadow:0 3px 0 #b26638,0 0 14px #ffb339,0 4px 18px #0005;pointer-events:none;animation:comboShow .7s ease-out both}.board.busy{pointer-events:none}.cell.gravity-column{background:#dcecff;box-shadow:inset 0 0 0 2px #6ba6ee}.test-levels{display:flex;gap:8px;margin:9px 0 13px}.test-levels button{flex:1;border:2px solid #c9d3e7;background:#fff;border-radius:11px;padding:10px 5px;color:#29304a;font-weight:750}.test-levels button.active{border-color:#477ddd;background:#e5efff}.test-guide{font-size:14px;background:#fff9e8;padding:10px 12px;border-radius:11px;margin-bottom:10px;color:#5f4a24}
@keyframes matchedPulse{0%{transform:scale(1);filter:brightness(1)}42%{transform:scale(1.15);filter:brightness(1.35)}76%{transform:scale(1.07);filter:brightness(1.28)}100%{transform:scale(1.12);filter:brightness(1.38)}}
@keyframes matchedPop{0%{transform:scale(1.12);opacity:1;filter:brightness(1.4)}38%{transform:scale(1.24);opacity:1}100%{transform:scale(.12) rotate(14deg);opacity:0}}
@keyframes spark{0%{transform:scale(.25) rotate(0);opacity:0}35%{opacity:1}100%{transform:scale(1.8) rotate(65deg);opacity:0}}
@keyframes fallIn{from{transform:translateY(calc(-1 * var(--fall-pixels)));filter:brightness(1.2)}78%{transform:translateY(3px)}to{transform:translateY(0);filter:brightness(1)}}
@keyframes comboShow{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-50%) scale(1.18);opacity:1}50%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-68%) scale(1.04);opacity:0}}
@media(max-width:400px){body{padding:10px}.board{gap:3px;border-width:5px}}@media(prefers-reduced-motion:reduce){.cell.match-mark .crate,.cell.match-pop .crate,.cell.match-pop::after,.crate.falling,.combo-banner{animation-duration:.08s!important}}
</style></head>
<body><main class="app"><h1>📦 Push & Crush</h1><p class="sub">倉庫番 × 三消｜互動玩法原型 v0.4</p><div class="test-levels"><button class="active" data-stage="0">① 局部重力</button><button data-stage="1">② Combo ×2</button></div><div class="test-guide" id="testGuide"></div><div class="stats"><div class="stat"><strong id="moves">0</strong><small>已推步數</small></div><div class="stat"><strong id="remain">0</strong><small>剩餘箱子</small></div><div class="stat"><strong id="combo">0</strong><small>最高連鎖</small></div></div><div class="board-wrap" id="boardWrap"><div class="board" id="board" aria-label="遊戲棋盤"></div></div><div class="buttons"><button id="undo">↶ 撤銷</button><button id="reset">⟳ 重玩</button><button id="shuffle">⤨ 重整</button><button id="hint">💡 提示</button></div><div class="dpad"><span class="blank"></span><button data-dir="up">↑</button><span class="blank"></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><div class="message" id="msg" aria-live="polite"></div><div class="help">玩法：方向鍵、WASD、畫面滑動或下方按鈕移動角色。走路免費；每次推箱一格扣 1 步。只能推不能拉；同色連續箱子可整排推動。三個同色連成直線時，先亮起提示再消除。<strong>只有發生消除的欄位</strong>會向下掉落，角色可以擋住掉落。<p>🧪 這是機制驗證用固定關卡：先測試局部重力，再測試 Combo。可切換兩個測試並使用「重玩」回到預設排列。</p></div></main>
<script>
'use strict';
const N=7,EMPTY='.',WALL='#';
const STAGES=[
 {name:'局部重力',guide:'第 1 關｜按一次「←」：紅色橫排三消後，只有第 1～3 欄下落。觀察右側第 4 欄的兩個黃色箱子：它們應原地不動。',level:['#######','#b..y.#','#.y...#','#..yy.#','#rr.r@#','#.....#','#######']},
 {name:'Combo ×2',guide:'第 2 關｜按一次「←」：紅色三消 → 第 1～3 欄的藍箱掉到最底下 → 三個藍箱連成一排，再自動觸發 COMBO ×2。第 4 欄的黃色箱子應原地不動。',level:['#######','#b..y.#','#.b...#','#..by.#','#rr.r@#','#.....#','#######']}
];
let stageIndex=0;
let board,player,moves,peak,history=[],busy=false,won=false;
const $=id=>document.getElementById(id),dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const isCrate=v=>v==='r'||v==='b'||v==='y';
const clone=()=>({board:board.map(row=>row.slice()),player:{...player},moves,peak,won});
const inside=(x,y)=>x>=0&&x<N&&y>=0&&y<N;
const cell=(x,y)=>inside(x,y)?board[y][x]:WALL;
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function message(t){$('msg').innerHTML=t}
function vibrate(pattern){if(navigator.vibrate)navigator.vibrate(pattern)}
function render(){const root=$('board');root.innerHTML='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=document.createElement('div');c.className='cell'+(cell(x,y)===WALL?' wall':'');c.dataset.x=x;c.dataset.y=y;if(x===player.x&&y===player.y){const p=document.createElement('div');p.className='player';p.textContent='🙂';c.appendChild(p)}else if(isCrate(cell(x,y))){const v=document.createElement('div');v.className='crate '+cell(x,y);v.textContent={r:'◆',b:'●',y:'★'}[cell(x,y)];c.appendChild(v)}root.appendChild(c)}root.classList.toggle('busy',busy);$('moves').textContent=moves;$('remain').textContent=board.flat().filter(isCrate).length;$('combo').textContent=peak}
function restore(s){board=s.board.map(row=>row.slice());player={...s.player};moves=s.moves;peak=s.peak;won=s.won;busy=false;render()}
function init(){board=STAGES[stageIndex].level.map(row=>row.split(''));player={x:5,y:4};board[player.y][player.x]=EMPTY;moves=0;peak=0;history=[];busy=false;won=false;clearBanner();render();$('testGuide').textContent=STAGES[stageIndex].guide;document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('active',Number(b.dataset.stage)===stageIndex));message('🧪 測試準備完成：先按一次「←」。')}
function matches(){const found=new Set();for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const v=cell(x,y);if(!isCrate(v))continue;for(const [dx,dy] of [[1,0],[0,1]]){if(cell(x-dx,y-dy)===v)continue;let xx=x,yy=y,coords=[];while(cell(xx,yy)===v){coords.push([xx,yy]);xx+=dx;yy+=dy}if(coords.length>=3)coords.forEach(([a,b])=>found.add(`${a},${b}`))}}return found}
function elementAt(x,y){return $('board').querySelector(`[data-x="${x}"][data-y="${y}"]`)}
function showBanner(text){clearBanner();const el=document.createElement('div');el.className='combo-banner';el.textContent=text;el.id='comboBanner';$('boardWrap').appendChild(el)}
function clearBanner(){$('comboBanner')?.remove()}
/* Only columns containing a removed crate can settle. The player and walls split columns into independent vertical segments. */
function gravity(columns){const falls=[];for(const x of columns){let bottom=N-2;for(let y=N-2;y>=1;y--){if(cell(x,y)===WALL||(player.x===x&&player.y===y)){bottom=y-1;continue}const v=cell(x,y);if(!isCrate(v))continue;if(y!==bottom){falls.push({x,from:y,to:bottom});board[bottom][x]=v;board[y][x]=EMPTY}bottom--}}return falls}
async function settle(){let combo=0;while(true){const m=matches();if(!m.size)break;combo++;peak=Math.max(peak,combo);const affectedColumns=new Set([...m].map(key=>Number(key.split(',')[0])));message(`✨ ${combo===1?'三消連線！':`COMBO ×${combo}！`} ${m.size} 個箱子準備消除`);showBanner(combo===1?'MATCH!':`COMBO ×${combo}`);render();for(const key of m){const [x,y]=key.split(',').map(Number);elementAt(x,y)?.classList.add('match-mark')}
// Show the recognized match before any tile is removed.
vibrate(combo===1?25:[25,40,Math.min(95,30+combo*12)]);await delay(440);
for(const key of m){const [x,y]=key.split(',').map(Number);const el=elementAt(x,y);el?.classList.remove('match-mark');el?.classList.add('match-pop')}
await delay(290);
for(const key of m){const [x,y]=key.split(',').map(Number);board[y][x]=EMPTY}
render();const falls=gravity(affectedColumns);render();for(const x of affectedColumns){for(let y=1;y<N-1;y++){elementAt(x,y)?.classList.add('gravity-column')}}message(`⬇️ 只有第 ${[...affectedColumns].sort((a,b)=>a-b).join('、')} 欄受到重力影響；右側黃色對照箱保持不動。`);if(falls.length){const cellH=elementAt(1,1)?.getBoundingClientRect().height||40;const gap=parseFloat(getComputedStyle($('board')).rowGap)||4;let maxDistance=0;for(const f of falls){const delta=f.to-f.from;maxDistance=Math.max(maxDistance,delta);const crate=elementAt(f.x,f.to)?.querySelector('.crate');if(crate){crate.classList.add('falling');crate.style.setProperty('--fall-pixels',`${delta*(cellH+gap)}px`);crate.style.setProperty('--fall-duration',`${Math.min(.52,.28+delta*.065)}s`)}}await delay(Math.min(520,280+maxDistance*65)+80)}else await delay(110);
clearBanner()}
busy=false;render();if(!board.flat().some(isCrate)){won=true;message(`<span class="win">🎉 過關！共 ${moves} 步，最高 Combo ×${Math.max(1,peak)}。</span>`);vibrate([80,60,110]);return}if(!hasPush()){message('🔄 無法再推動箱子，自動重整！');await delay(400);shuffle(true)}else if(combo)message(`成功觸發 ${combo} 段消除！只有消除欄位受到重力影響。`)}
function tryMove(dir){if(busy||won)return;const [dx,dy]=dirs[dir];let x=player.x+dx,y=player.y+dy;const v=cell(x,y);if(v===WALL)return;if(v===EMPTY){player={x,y};render();return}if(!isCrate(v))return;const line=[];while(cell(x,y)===v){line.push([x,y]);x+=dx;y+=dy}if(cell(x,y)!==EMPTY){message('⛔ 只能推動連續同色箱子，而且末端必須有空位。');return}history.push(clone());for(let i=line.length-1;i>=0;i--){const [cx,cy]=line[i];board[cy+dy][cx+dx]=v;board[cy][cx]=EMPTY}player={x:line[0][0],y:line[0][1]};moves++;busy=true;render();if(matches().size)settle();else{busy=false;render();message(`推動 ${line.length} 個同色箱子，消耗 1 步。`);if(!hasPush())setTimeout(()=>{if(!busy&&!won&&!hasPush())shuffle(true)},280)}}
function hasPush(){const stack=[[player.x,player.y]],seen=new Set([`${player.x},${player.y}`]);while(stack.length){const [x,y]=stack.pop();for(const [ax,ay] of Object.values(dirs)){const nx=x+ax,ny=y+ay;if(cell(nx,ny)!==EMPTY||seen.has(`${nx},${ny}`))continue;seen.add(`${nx},${ny}`);stack.push([nx,ny])}for(const [dx,dy] of Object.values(dirs)){const v=cell(x+dx,y+dy);if(!isCrate(v))continue;let nx=x+dx,ny=y+dy;while(cell(nx,ny)===v){nx+=dx;ny+=dy}if(cell(nx,ny)===EMPTY)return true}}return false}
function shuffle(auto=false){if(busy||won)return;if(!auto)history.push(clone());const spots=[],colors=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){if(cell(x,y)===WALL||(x===player.x&&y===player.y))continue;spots.push([x,y]);if(isCrate(cell(x,y)))colors.push(cell(x,y));board[y][x]=EMPTY}let good=false;for(let attempt=0;attempt<300;attempt++){for(const [x,y] of spots)board[y][x]=EMPTY;const randomized=spots.slice().sort(()=>Math.random()-.5);colors.forEach((c,i)=>{const [x,y]=randomized[i];board[y][x]=c});if(hasPush()&&matches().size===0){good=true;break}}render();message(good?'🔀 箱子已重整，角色位置不變。':'🔀 已重整箱子；目前盤面可能仍需要再重整。')}
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{if(busy)return;stageIndex=Number(b.dataset.stage);init()});$('undo').onclick=()=>{if(busy)return;if(history.length)restore(history.pop());else message('沒有可以撤銷的推動。')};$('reset').onclick=()=>{if(busy)return;init()};$('shuffle').onclick=()=>shuffle(false);$('hint').onclick=()=>message('💡 兩個測試關卡都只需要在初始畫面按一次「←」，就能觀察紅箱消除與指定欄位掉落。');document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>tryMove(b.dataset.dir));window.addEventListener('keydown',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(k){e.preventDefault();tryMove(k)}});let touch=null;const root=$('board');root.addEventListener('touchstart',e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});root.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.hypot(dx,dy)>22)tryMove(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));touch=null},{passive:true});init();
</script><noscript>請啟用 JavaScript，並使用 Safari 或 Chrome 開啟本網頁。</noscript></body></html>
